gi# Bancos independentes em memoria para os testes.
app.datasource.main.jdbc-url=jdbc:h2:mem:systempetshop_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.main.username=sa
app.datasource.main.password=
app.datasource.main.driver-class-name=org.h2.Driver

app.datasource.productexpired.jdbc-url=jdbc:h2:mem:systemexpired_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.productexpired.username=sa
app.datasource.productexpired.password=
app.datasource.productexpired.driver-class-name=org.h2.Driver

app.datasource.productmetrics.jdbc-url=jdbc:h2:mem:systemmetrics_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.productmetrics.username=sa
app.datasource.productmetrics.password=
app.datasource.productmetrics.driver-class-name=org.h2.Driver

# O teste de contexto nao depende de servicos externos.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
app.outbox.publisher-enabled=false
spring.ai.openai.api-key=test-key
