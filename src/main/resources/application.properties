app.application.name=SystemPetShop

app.jpa.hibernate.ddl-auto=update
app.jpa.show-sql=true
app.jpa.properties.hibernate.format_sql=true

app.datasource.main.jdbc-url=${DB_MAIN}
app.datasource.main.username=${DB_MAIN_USER}
app.datasource.main.password=${DB_MAIN_PASSWORD}
app.datasource.main.driver-class-name=com.mysql.cj.jdbc.Driver

app.datasource.productexpired.jdbc-url=${DB_EXPIRED}
app.datasource.productexpired.username=${DB_EXPIRED_USER}
app.datasource.productexpired.password=${DB_EXPIRED_PASSWORD}
app.datasource.productexpired.driver-class-name=com.mysql.cj.jdbc.Driver

app.datasource.productmetrics.jdbc-url=${DB_METRICS}
app.datasource.productmetrics.username=${DB_METRICS_USER}
app.datasource.productmetrics.password=${DB_METRICS_PASSWORD}
app.datasource.productmetrics.driver-class-name=com.mysql.cj.jdbc.Driver

spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.main.allow-bean-definition-overriding=true
spring.ai.openai.api-key=${OPENAPI_KEY}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
